# The yt-stream stack on the Monash box. auto-deploy.sh copies this file to
# ~/yt-stream/compose.yaml, next to .env, and runs it from there.
#
# Postgres and the api are containers on a private network; nothing but the api's
# loopback port is published, and ngrok publishes that outward. The speech service
# is not a container: it needs the GPU and the diarize conda env, so it runs on the
# host (run-speech.sh) bound to the docker bridge address, which is what
# host.docker.internal resolves to inside the api container. The llm-proxy is a third
# container on the same private network.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: yt_stream
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The llm-proxy, built from the clone. No published port: only the api calls it. The
  # login is CLAUDE_CODE_OAUTH_TOKEN in ~/yt-stream/.env; without it the stack still
  # comes up and every extraction call is stored as a failed call.
  llm-proxy:
    build: ../projects/yt-stream/proxy
    image: yt-stream-llm-proxy:local
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

  api:
    build: ../projects/yt-stream/backend
    image: yt-stream-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8092"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: yt_stream
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      SPEECH_URL: ws://host.docker.internal:8100/sessions
      LLM_PROXY_URL: http://llm-proxy:4000
      API_SHARED_SECRET: ${API_SHARED_SECRET:?set API_SHARED_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    healthcheck:
      # /health is 200 when Postgres answers and 503 when it does not. start_period
      # covers the migrations, which run before the process listens.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  # The dashboard, built from the clone, beside the public one on Vercel. Loopback only: it is
  # opened over an SSH tunnel (deploy/README.md), and ngrok does not publish it. It reads the api
  # over the private network. Without ACCESS_PASSWORD in .env it still starts, and its password
  # gate refuses everyone, so a missing value never takes the rest of the stack down with it.
  web:
    build: ../projects/yt-stream/frontend
    image: yt-stream-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3092:3000"
    environment:
      BACKEND_URL: http://api:8092
      API_SHARED_SECRET: ${API_SHARED_SECRET:?set API_SHARED_SECRET in .env}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
