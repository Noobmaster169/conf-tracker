# The live relay on the yt-engine VPS's k3s. relay/ship.sh fills ${IMAGE} and ${RELAY_HOST} and applies it.
# Its own namespace, small limits: it must never take memory from yt-engine, which shares the machine.
apiVersion: v1
kind: Namespace
metadata:
  name: conf-relay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: conf-relay
spec:
  replicas: 1
  selector:
    matchLabels: { app: relay }
  template:
    metadata:
      labels: { app: relay }
    spec:
      containers:
        - name: relay
          image: ${IMAGE}
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: conf-relay-env } }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 160Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: conf-relay
spec:
  selector: { app: relay }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  namespace: conf-relay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # An event stream is one long response: no buffering, and no 60 s idle cut (the relay pings every 15 s).
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [${RELAY_HOST}]
      secretName: conf-relay-tls
  rules:
    - host: ${RELAY_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: relay, port: { name: http } }
